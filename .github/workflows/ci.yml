name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

jobs:
  # H3 gate (2026-10-07 app.db incident): runtime data must never be tracked —
  # a tracked DB can be rolled back over a live one by checkout, replaying
  # foreign -wal frames into the old base (cross-lineage SQLITE_CORRUPT).
  # This is the minimal CI for main until the full test infra (pnpm verify,
  # per-package vitest) lands via the feature-branch merge.
  h3-runtime-data-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject tracked runtime data
        run: |
          bad=$(git ls-files | grep -E '\.db$|\.db-shm$|\.db-wal$|\.sqlite$|-wal$|-shm$|^data/projects/|^data_archive/' || true)
          if [ -n "$bad" ]; then echo "tracked runtime data:"; echo "$bad"; exit 1; fi
